<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Gallery</title>

    <style>

        /* Styling Images */
        .eventImage {
            width: 200px;
            height: 150px;
            border: 3px solid blue;
            border-radius: 10px;
            padding: 5px;
        }

        table {
            margin: auto;
            border-spacing: 15px;
        }

        caption {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

    </style>
</head>

<body>

    <table>

        <!-- Table Caption -->
        <caption>Past Community Events Gallery</caption>

        <!-- First Row -->
        <tr>

            <td>
                <img src="event1.jpg"
                     alt="Tree Plantation Event"
                     title="Tree Plantation Drive"
                     class="eventImage">

                <p>Tree Plantation Program</p>
            </td>

            <td>
                <img src="event2.jpg"
                     alt="Health Camp"
                     title="Free Health Checkup"
                     class="eventImage">

                <p>Community Health Camp</p>
            </td>

            <td>
                <img src="event3.jpg"
                     alt="Food Festival"
                     title="Annual Food Festival"
                     class="eventImage">

                <p>Annual Food Festival</p>
            </td>

        </tr>

        <!-- Second Row -->
        <tr>

            <td>
                <img src="event4.jpg"
                     alt="Sports Event"
                     title="Youth Sports Competition"
                     class="eventImage">

                <p>Sports Competition</p>
            </td>

            <td>
                <img src="event5.jpg"
                     alt="Music Event"
                     title="Community Music Night"
                     class="eventImage">

                <p>Music Night Celebration</p>
            </td>

            <td>
                <img src="event6.jpg"
                     alt="Cleanliness Drive"
                     title="City Cleanliness Program"
                     class="eventImage">

                <p>Cleanliness Awareness Drive</p>
            </td>

        </tr>

    </table>

</body>

</html>
