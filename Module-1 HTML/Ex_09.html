<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Events Locator</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        .container {
            width: 500px;
            margin: auto;
            margin-top: 50px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #location {
            margin-top: 20px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>Find Nearby Events</h2>

        <!-- Location Button -->
        <button onclick="findLocation()">
            Find Nearby Events
        </button>

        <!-- Result -->
        <p id="location"></p>

    </div>

    <script>

        function findLocation() {

            if(navigator.geolocation) {

                navigator.geolocation.getCurrentPosition(

                    showPosition,
                    showError,

                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }

                );

            }
            else {

                document.getElementById("location")
                .innerHTML =
                "Geolocation is not supported.";

            }

        }

        // Success Function
        function showPosition(position) {

            let latitude =
            position.coords.latitude;

            let longitude =
            position.coords.longitude;

            document.getElementById("location")
            .innerHTML =

            "Latitude: " + latitude +
            "<br>Longitude: " + longitude;

        }

        // Error Function
        function showError(error) {

            switch(error.code) {

                case error.PERMISSION_DENIED:

                    document.getElementById("location")
                    .innerHTML =
                    "Permission denied by user.";

                    break;

                case error.TIMEOUT:

                    document.getElementById("location")
                    .innerHTML =
                    "Location request timed out.";

                    break;

                case error.POSITION_UNAVAILABLE:

                    document.getElementById("location")
                    .innerHTML =
                    "Location information unavailable.";

                    break;

                default:

                    document.getElementById("location")
                    .innerHTML =
                    "Unknown error.";

            }

        }

    </script>

</body>

</html>
