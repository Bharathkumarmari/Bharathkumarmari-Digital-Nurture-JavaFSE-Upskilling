<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Banner</title>

    <!-- Internal CSS -->
    <style>

        /* ID Selector */
        #welcomeBanner {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Class Selector */
        .highlight {
            background-color: yellow;
            font-weight: bold;
            padding: 5px;
        }

    </style>
</head>

<body>

    <!-- Welcome Banner -->
    <div id="welcomeBanner">

        <h1>Welcome to the Community Event Portal</h1>

        <p class="highlight">
            Residents can register for local events here.
        </p>

        <!-- Inline CSS -->
        <p style="color:red; font-weight:bold;">
            Special Offer: Free entry for senior citizens!
        </p>

    </div>

</body>

</html>
